services:
  backend:
    build: 
      context: ./quote_book
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./quote_book:/app
    env_file:
      - .env
    environment:
      - DEBUG=True
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build:
      context: ./telegram_bot
      dockerfile: Dockerfile
    volumes:
      - ./telegram_bot:/app
    env_file:
      - .env
    environment:
      - API_URL=http://backend:8000/api
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

