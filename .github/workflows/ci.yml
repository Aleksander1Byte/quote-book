name: CI

on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - run: pip install -r requirements-dev.txt
    
    - run: flake8 .
    - run: python manage.py test

