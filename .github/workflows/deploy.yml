name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - run: pip install -r quote_book/requirements.txt
      - run: cd quote_book/ && python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            # Каталог проекта на сервере (переопределяется переменной DEPLOY_PATH)
            DEPLOY_PATH="${{ vars.DEPLOY_PATH || '/opt/quote-book' }}"
            cd "$DEPLOY_PATH"

            # docker compose v2 или старый docker-compose — выбираем доступный
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi

            echo "==> Pulling latest main"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Building images"
            $DC build

            echo "==> Applying migrations"
            $DC run --rm backend python manage.py migrate --noinput

            echo "==> Restarting services"
            $DC up -d

            echo "==> Pruning dangling images"
            docker image prune -f
